name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm run install:all
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm --prefix server audit --omit=dev --audit-level=high
      - run: npm --prefix web audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t any-ssh:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --cap-drop ALL \
            -e ANYSSH_MASTER_KEY="$(openssl rand -base64 32)" -p 8080:8080 any-ssh:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
      - run: shellcheck deploy/install.sh deploy/any-ssh
      - name: Install with deploy/install.sh using this image
        run: |
          docker rm -f app
          docker tag any-ssh:ci ghcr.io/maffewem/any-ssh:latest
          sudo ANYSSH_SOURCE="file://$PWD" ANYSSH_DOMAIN=any-ssh.ci.invalid ANYSSH_EMAIL= bash deploy/install.sh
          sudo any-ssh setup-token
          sudo any-ssh backup
          sudo ls /opt/any-ssh/backups | grep -q '^any-ssh-'
          sudo any-ssh status
          sudo any-ssh doctor || true   # the CI domain has no DNS, so this reports problems

  # Publishes the image that deploy/install.sh and `any-ssh update` pull, only after the tests and the smoke test pass.
  # main → :latest and :sha-<commit>; a tag like v1.2.3 → :1.2.3 and :1.2.
  publish:
    if: github.event_name == 'push'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/maffewem/any-ssh
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Intel/AMD servers and ARM ones (Raspberry Pi, AWS Graviton, Hetzner/Oracle ARM).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
