name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm run install:all
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm --prefix server audit --omit=dev --audit-level=high
      - run: npm --prefix web audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t any-ssh:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --cap-drop ALL \
            -e ANYSSH_MASTER_KEY="$(openssl rand -base64 32)" -p 8080:8080 any-ssh:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
